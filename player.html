<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cloud Music Player</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      background: transparent;
    }

    #player {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
  </style>
</head>

<body>

  <audio
    id="player"
    preload="metadata"
    playsinline
  ></audio>

  <script>
    const player = document.getElementById("player");

    const params = new URLSearchParams(
      window.location.search
    );

    const musicUrl = params.get("url");

    if (musicUrl) {
      player.src = musicUrl;
      player.load();
    }

    let lastCommand = "";

    function readCommand() {
      if (
        !window.AppInventor ||
        !window.AppInventor.getWebViewString
      ) {
        return;
      }

      const command =
        window.AppInventor.getWebViewString() || "";

      if (!command || command === lastCommand) {
        return;
      }

      lastCommand = command;

      if (command.startsWith("PLAY")) {
        player.play().catch(function(error) {
          console.log(error);
        });
      }

      if (command.startsWith("PAUSE")) {
        player.pause();
      }

      if (command.startsWith("STOP")) {
        player.pause();
        player.currentTime = 0;
      }

      if (command.startsWith("SEEK|")) {
        const parts = command.split("|");
        const seconds = Number(parts[1]);

        if (!isNaN(seconds)) {
          player.currentTime = seconds;
        }
      }
    }

    setInterval(readCommand, 200);

    function sendStatus() {
      if (
        !window.AppInventor ||
        !window.AppInventor.setWebViewString
      ) {
        return;
      }

      const status = [
        "STATUS",
        Math.floor(player.currentTime || 0),
        Math.floor(player.duration || 0),
        player.paused ? "PAUSED" : "PLAYING"
      ].join("|");

      window.AppInventor.setWebViewString(status);
    }

    player.addEventListener("timeupdate", sendStatus);
    player.addEventListener("loadedmetadata", sendStatus);
    player.addEventListener("play", sendStatus);
    player.addEventListener("pause", sendStatus);
  </script>

</body>
</html>
