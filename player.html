<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cloud Music Player</title>

  <style>
    body {
      margin: 0;
      padding: 8px;
      background: white;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <audio
    id="player"
    controls
    preload="metadata"
  ></audio>

  <script>
    const params = new URLSearchParams(
      window.location.search
    );

    const musicUrl = params.get("url");

    const player = document.getElementById("player");

    if (musicUrl) {
      player.src = musicUrl;
      player.load();
    }
  </script>

</body>
</html>
